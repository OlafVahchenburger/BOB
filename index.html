<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <style>
    :root {
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-container: #21005D;
      --md-sys-color-secondary: #625B71;
      --md-sys-color-secondary-container: #E8DEF8;
      --md-sys-color-on-secondary-container: #1D192B;
      --md-sys-color-tertiary: #7D5260;
      --md-sys-color-tertiary-container: #FFD8E4;
      --md-sys-color-surface: #FFFBFE;
      --md-sys-color-surface-variant: #E7E0EC;
      --md-sys-color-on-surface: #1C1B1F;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;
      --md-sys-color-inverse-surface: #313033;
      --md-elevation-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15);
      --md-elevation-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);
      --md-elevation-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: #F4EFF4;
      color: var(--md-sys-color-on-surface);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Bar */
    .top-app-bar {
      background: var(--md-sys-color-surface);
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--md-elevation-2);
      flex-shrink: 0;
      z-index: 10;
    }
    .top-app-bar h1 {
      font-size: 22px;
      font-weight: 400;
      color: var(--md-sys-color-on-surface);
      flex: 1;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .4; }
    }
    .kb-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--md-sys-color-primary);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: background .2s;
    }
    .kb-btn:hover { background: var(--md-sys-color-primary-container); }
    .kb-count {
      background: var(--md-sys-color-primary);
      color: white;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 12px;
    }

    /* Layout */
    .body-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--md-sys-color-surface);
      border-left: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header span { font-size: 14px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); }
    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: none;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: box-shadow .2s;
    }
    .new-chat-btn:hover { box-shadow: var(--md-elevation-1); }

    .chat-history { flex: 1; overflow-y: auto; padding: 8px; }
    .history-item {
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      transition: background .2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover { background: var(--md-sys-color-surface-variant); }
    .history-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    /* KB Panel in sidebar */
    .kb-panel {
      padding: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
    }
    .kb-panel h3 { font-size: 12px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .kb-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--md-sys-color-surface-variant);
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 4px;
    }
    .kb-chip .material-symbols-outlined { font-size: 14px; }

    /* Chat Area */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Welcome Screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 24px;
      padding: 40px;
    }
    .welcome-logo {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--md-elevation-3);
    }
    .welcome-logo .material-symbols-outlined { font-size: 36px; color: white; }
    .welcome-screen h2 { font-size: 28px; font-weight: 400; text-align: center; }
    .welcome-screen p { font-size: 15px; color: var(--md-sys-color-on-surface-variant); text-align: center; max-width: 480px; line-height: 1.6; }
    .suggestions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 560px;
    }
    .suggestion-card {
      background: var(--md-sys-color-surface);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      border: 1px solid var(--md-sys-color-outline-variant);
      transition: all .2s;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      text-align: right;
    }
    .suggestion-card:hover {
      background: var(--md-sys-color-primary-container);
      border-color: var(--md-sys-color-primary);
      transform: translateY(-2px);
      box-shadow: var(--md-elevation-1);
    }
    .suggestion-card .icon { font-size: 20px; margin-bottom: 8px; color: var(--md-sys-color-primary); }

    /* Messages */
    .message {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: msgIn .2s ease-out;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.ai    { align-self: flex-start; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .avatar.ai-avatar {
      background: linear-gradient(135deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
    }
    .avatar.ai-avatar .material-symbols-outlined { font-size: 18px; color: white; }
    .avatar.user-avatar {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-secondary);
      font-weight: 500;
      font-size: 14px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.6;
      max-width: 100%;
    }
    .message.user .bubble {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-bottom-left-radius: 4px;
    }
    .message.ai .bubble {
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      border-bottom-right-radius: 4px;
      box-shadow: var(--md-elevation-1);
    }

    /* KB reference tag in message */
    .kb-ref {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-secondary);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
      margin: 2px 0;
    }
    .kb-ref .material-symbols-outlined { font-size: 12px; }

    /* Typing indicator */
    .typing-bubble {
      background: var(--md-sys-color-surface);
      border-radius: 20px;
      border-bottom-right-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
      box-shadow: var(--md-elevation-1);
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--md-sys-color-on-surface-variant);
      animation: bounce .9s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: .15s; }
    .typing-dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 16px 24px 24px;
      background: #F4EFF4;
      flex-shrink: 0;
    }
    .input-wrapper {
      background: var(--md-sys-color-surface);
      border-radius: 28px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 8px 8px 16px;
      box-shadow: var(--md-elevation-2);
      transition: box-shadow .2s;
    }
    .input-wrapper:focus-within { box-shadow: var(--md-elevation-3); }
    .input-wrapper textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 16px;
      font-family: inherit;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      padding: 8px 0;
      max-height: 150px;
      line-height: 1.5;
    }
    .send-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: #7965AF; box-shadow: var(--md-elevation-1); }
    .send-btn:disabled { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); cursor: default; }

    .input-hint {
      text-align: center;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 8px;
    }

    /* API key dialog */
    .dialog-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .dialog-overlay.open { display: flex; }
    .dialog {
      background: var(--md-sys-color-surface);
      border-radius: 28px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--md-elevation-3);
      animation: dialogIn .2s ease-out;
    }
    @keyframes dialogIn {
      from { transform: scale(.9); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }
    .dialog h2 { font-size: 24px; font-weight: 400; margin-bottom: 8px; }
    .dialog p  { font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 20px; line-height: 1.5; }
    .field-wrapper { position: relative; margin-bottom: 16px; }
    .field-wrapper label {
      position: absolute; top: 16px; right: 16px;
      font-size: 14px; color: var(--md-sys-color-on-surface-variant);
      pointer-events: none; transition: all .15s;
      background: var(--md-sys-color-surface); padding: 0 4px;
    }
    .field-wrapper input:focus ~ label,
    .field-wrapper input:not(:placeholder-shown) ~ label {
      top: -8px; font-size: 12px; color: var(--md-sys-color-primary);
    }
    .field-wrapper input {
      width: 100%; padding: 16px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 4px;
      font-size: 15px; font-family: inherit;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      outline: none; transition: border-color .2s;
    }
    .field-wrapper input:focus { border-color: var(--md-sys-color-primary); border-width: 2px; }
    .model-selector {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .model-chip {
      padding: 6px 16px; border-radius: 16px;
      border: 1px solid var(--md-sys-color-outline);
      font-size: 13px; cursor: pointer;
      transition: all .2s; background: none;
      color: var(--md-sys-color-on-surface-variant);
    }
    .model-chip.selected {
      background: var(--md-sys-color-primary);
      color: white; border-color: var(--md-sys-color-primary);
    }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-text {
      padding: 10px 24px; border: none; background: none;
      border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; color: var(--md-sys-color-primary); transition: background .2s;
    }
    .btn-text:hover { background: var(--md-sys-color-primary-container); }
    .btn-filled {
      padding: 10px 24px; border: none;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: box-shadow .2s;
    }
    .btn-filled:hover { box-shadow: var(--md-elevation-2); }

    /* Settings gear */
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%; border: none; background: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--md-sys-color-on-surface-variant); transition: background .2s;
    }
    .icon-btn:hover { background: var(--md-sys-color-surface-variant); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 3px; }
  </style>
</head>
<body>

<div class="top-app-bar">
  <div class="welcome-logo" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6750A4,#7D5260);display:flex;align-items:center;justify-content:center">
    <span class="material-symbols-outlined" style="font-size:18px;color:white">smart_toy</span>
  </div>
  <h1>AI Assistant</h1>
  <div class="status-dot"></div>
  <a class="kb-btn" href="knowledge.html">
    <span class="material-symbols-outlined" style="font-size:18px">hub</span>
    מאגר ידע
    <span class="kb-count" id="kbCount">0</span>
  </a>
  <button class="icon-btn" onclick="openSettings()" title="הגדרות">
    <span class="material-symbols-outlined">settings</span>
  </button>
</div>

<div class="body-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>שיחות</span>
      <button class="new-chat-btn" onclick="newChat()">
        <span class="material-symbols-outlined" style="font-size:16px">add</span>
        חדש
      </button>
    </div>
    <div class="chat-history" id="chatHistory"></div>
    <div class="kb-panel" id="kbPanel">
      <h3>מאגר ידע פעיל</h3>
      <div id="kbSummary"></div>
    </div>
  </aside>

  <!-- Chat -->
  <div class="chat-container">
    <div class="messages-area" id="messagesArea"></div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          placeholder="שאל אותי כל דבר... אני מחובר למאגר הידע שלך"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
      <p class="input-hint" id="modelHint">הגדר מפתח API בהגדרות כדי להפעיל את ה-AI</p>
    </div>
  </div>
</div>

<!-- Settings Dialog -->
<div class="dialog-overlay" id="settingsDialog">
  <div class="dialog">
    <h2>הגדרות AI</h2>
    <p>בחר ספק AI, הגדר מפתח API ובחר מודל. המפתחות נשמרים רק בדפדפן שלך (localStorage).</p>

    <label style="font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-bottom:8px;display:block">ספק AI</label>
    <div class="model-selector" id="providerSelector">
      <button class="model-chip" data-provider="anthropic" onclick="selectProvider(this)">Claude (Anthropic)</button>
      <button class="model-chip" data-provider="openai" onclick="selectProvider(this)">ChatGPT (OpenAI)</button>
      <button class="model-chip" data-provider="google" onclick="selectProvider(this)">Gemini (Google)</button>
    </div>

    <div class="field-wrapper">
      <input type="password" id="apiKeyInput" placeholder=" " />
      <label id="apiKeyLabel">Anthropic API Key</label>
    </div>

    <label style="font-size:12px;color:var(--md-sys-color-on-surface-variant);margin-bottom:8px;display:block">מודל</label>
    <div class="model-selector" id="modelSelector"></div>

    <div class="field-wrapper">
      <input type="text" id="systemPromptInput" placeholder=" " />
      <label>System Prompt (אופציונלי)</label>
    </div>

    <div class="dialog-actions">
      <button class="btn-text" onclick="closeSettings()">ביטול</button>
      <button class="btn-filled" onclick="saveSettings()">שמור</button>
    </div>
  </div>
</div>

<script>
  // ─── State ──────────────────────────────────────────────────────────
  const STORAGE_KEY   = 'knowledgeBase';
  const CATEGORY_KEY  = 'knowledgeCategories';
  const SETTINGS_KEY  = 'aiSettings';
  const SESSIONS_KEY  = 'aiSessions';

  // ─── AI Providers ───────────────────────────────────────────────────
  const PROVIDERS = {
    anthropic: {
      name: 'Claude',
      keyLabel: 'Anthropic API Key',
      models: [
        ['claude-opus-4-8', 'Claude Opus 4.8'],
        ['claude-sonnet-4-6', 'Claude Sonnet 4.6'],
        ['claude-haiku-4-5-20251001', 'Claude Haiku 4.5'],
      ],
    },
    openai: {
      name: 'ChatGPT',
      keyLabel: 'OpenAI API Key',
      models: [
        ['gpt-4o', 'GPT-4o'],
        ['gpt-4o-mini', 'GPT-4o mini'],
        ['gpt-4.1', 'GPT-4.1'],
        ['o3-mini', 'o3-mini'],
      ],
    },
    google: {
      name: 'Gemini',
      keyLabel: 'Google AI API Key',
      models: [
        ['gemini-2.5-pro', 'Gemini 2.5 Pro'],
        ['gemini-2.5-flash', 'Gemini 2.5 Flash'],
        ['gemini-2.0-flash', 'Gemini 2.0 Flash'],
      ],
    },
  };

  let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
  let sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY) || '[]');
  let currentSessionId = null;
  let isLoading = false;

  // Migrate old single-key settings format
  if (!settings.apiKeys) {
    settings.apiKeys = { anthropic: settings.apiKey || '', openai: '', google: '' };
  }
  let selectedProvider = settings.provider in PROVIDERS ? settings.provider : 'anthropic';
  let selectedModel = settings.model || PROVIDERS[selectedProvider].models[0][0];
  if (!PROVIDERS[selectedProvider].models.some(([id]) => id === selectedModel)) {
    selectedModel = PROVIDERS[selectedProvider].models[0][0];
  }

  function currentApiKey() { return (settings.apiKeys[selectedProvider] || '').trim(); }

  function getKB() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  function getCategories() { return JSON.parse(localStorage.getItem(CATEGORY_KEY) || '[]'); }

  // ─── KB Sidebar ─────────────────────────────────────────────────────
  function updateKBPanel() {
    const items = getKB();
    const cats  = getCategories();
    document.getElementById('kbCount').textContent = items.length;

    const summary = document.getElementById('kbSummary');
    if (items.length === 0) {
      summary.innerHTML = `<div style="font-size:12px;color:var(--md-sys-color-on-surface-variant);opacity:.6">אין פריטים עדיין</div>`;
      return;
    }
    const byCat = {};
    items.forEach(i => { byCat[i.category] = (byCat[i.category] || 0) + 1; });
    summary.innerHTML = Object.entries(byCat).map(([catId, count]) => {
      const cat = cats.find(c => c.id === catId);
      return `<div class="kb-chip">
        <span class="material-symbols-outlined">${cat ? cat.icon : 'folder'}</span>
        ${cat ? cat.name : catId} (${count})
      </div>`;
    }).join('');
  }

  // ─── Sessions / History ─────────────────────────────────────────────
  function saveSessions() { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }

  function newChat() {
    const s = { id: Date.now().toString(), title: 'שיחה חדשה', messages: [], createdAt: new Date().toISOString() };
    sessions.unshift(s);
    saveSessions();
    loadSession(s.id);
    renderHistory();
  }

  function loadSession(id) {
    currentSessionId = id;
    renderHistory();
    const s = sessions.find(x => x.id === id);
    if (!s) return;
    const area = document.getElementById('messagesArea');
    if (s.messages.length === 0) {
      renderWelcome();
    } else {
      area.innerHTML = '';
      s.messages.forEach(m => appendMessage(m.role, m.content, false));
      area.scrollTop = area.scrollHeight;
    }
  }

  function renderHistory() {
    const hist = document.getElementById('chatHistory');
    if (sessions.length === 0) {
      hist.innerHTML = `<div style="padding:16px;font-size:13px;color:var(--md-sys-color-on-surface-variant);opacity:.6;text-align:center">אין שיחות עדיין</div>`;
      return;
    }
    hist.innerHTML = sessions.slice(0, 30).map(s => `
      <div class="history-item ${s.id === currentSessionId ? 'active' : ''}" onclick="loadSession('${s.id}')">
        ${escHtml(s.title)}
      </div>
    `).join('');
  }

  function currentSession() { return sessions.find(x => x.id === currentSessionId); }

  // ─── Welcome ────────────────────────────────────────────────────────
  function renderWelcome() {
    const kb = getKB();
    document.getElementById('messagesArea').innerHTML = `
      <div class="welcome-screen">
        <div class="welcome-logo">
          <span class="material-symbols-outlined">smart_toy</span>
        </div>
        <h2>שלום! איך אוכל לעזור?</h2>
        <p>אני מחובר למאגר הידע שלך עם <strong>${kb.length} פריטים</strong>. שאל אותי שאלות, ואני אשתמש במידע שהגדרת.</p>
        <div class="suggestions">
          <div class="suggestion-card" onclick="usePrompt('מה יש במאגר הידע שלי?')">
            <div class="icon"><span class="material-symbols-outlined">inventory_2</span></div>
            מה יש במאגר הידע שלי?
          </div>
          <div class="suggestion-card" onclick="usePrompt('סכם לי את כל הפריטים לפי קטגוריות')">
            <div class="icon"><span class="material-symbols-outlined">category</span></div>
            סכם לפי קטגוריות
          </div>
          <div class="suggestion-card" onclick="usePrompt('מהם הקשרים בין הפריטים השונים?')">
            <div class="icon"><span class="material-symbols-outlined">device_hub</span></div>
            מהם הקשרים?
          </div>
          <div class="suggestion-card" onclick="usePrompt('עזור לי לארגן את המידע שלי')">
            <div class="icon"><span class="material-symbols-outlined">auto_awesome</span></div>
            עזור לי לארגן
          </div>
        </div>
      </div>
    `;
  }

  function usePrompt(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  // ─── Messages ────────────────────────────────────────────────────────
  function appendMessage(role, content, scroll = true) {
    const area = document.getElementById('messagesArea');
    // Remove welcome screen if present
    const ws = area.querySelector('.welcome-screen');
    if (ws) ws.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'ai' ? 'ai-avatar' : 'user-avatar'}`;
    if (role === 'ai') {
      avatar.innerHTML = `<span class="material-symbols-outlined">smart_toy</span>`;
    } else {
      avatar.textContent = 'א';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatContent(content);

    div.appendChild(avatar);
    div.appendChild(bubble);
    area.appendChild(div);

    if (scroll) area.scrollTop = area.scrollHeight;
    return div;
  }

  function formatContent(text) {
    // Bold **text**
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    text = text.replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,.08);padding:1px 5px;border-radius:3px;font-family:monospace">$1</code>');
    // KB references [[item]]
    text = text.replace(/\[\[([^\]]+)\]\]/g, '<span class="kb-ref"><span class="material-symbols-outlined">link</span>$1</span>');
    // Newlines
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function showTyping() {
    const area = document.getElementById('messagesArea');
    const div = document.createElement('div');
    div.className = 'message ai';
    div.id = 'typingIndicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ai-avatar';
    avatar.innerHTML = `<span class="material-symbols-outlined">smart_toy</span>`;
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = `<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>`;
    div.appendChild(avatar);
    div.appendChild(bubble);
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  // ─── Send ─────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text || isLoading) return;

    if (!currentApiKey()) { openSettings(); return; }
    if (!currentSessionId) newChat();

    const session = currentSession();
    input.value = '';
    autoResize(input);

    // Add user message
    session.messages.push({ role: 'user', content: text });
    if (session.title === 'שיחה חדשה' && session.messages.length === 1) {
      session.title = text.slice(0, 40) + (text.length > 40 ? '…' : '');
    }
    saveSessions();
    appendMessage('user', text);
    renderHistory();

    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    showTyping();

    try {
      const reply = await callAI(session.messages);
      hideTyping();
      session.messages.push({ role: 'assistant', content: reply });
      saveSessions();
      appendMessage('ai', reply);
    } catch (err) {
      hideTyping();
      appendMessage('ai', `⚠️ שגיאה: ${err.message}`);
    }

    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
  }

  // ─── AI APIs ──────────────────────────────────────────────────────
  function buildSystemPrompt() {
    const kb    = getKB();
    const cats  = getCategories();

    let systemPrompt = settings.systemPrompt || 'אתה עוזר AI חכם ומועיל שעונה בעברית.';

    if (kb.length > 0) {
      const kbText = kb.map(item => {
        const cat = cats.find(c => c.id === item.category);
        let s = `[${cat ? cat.name : item.category}] ${item.name}`;
        if (item.content) s += `: ${item.content}`;
        if (item.relations && item.relations.length) s += ` | קשרים: ${item.relations.join(', ')}`;
        return s;
      }).join('\n');

      systemPrompt += `\n\n--- מאגר הידע של המשתמש ---\n${kbText}\n\nהשתמש במידע זה כשרלוונטי. כאשר אתה מזכיר פריט מהמאגר, עטוף אותו ב-[[שם הפריט]].`;
    }
    return systemPrompt;
  }

  function normalizeHistory(history) {
    return history.map(m => ({
      role: m.role === 'ai' ? 'assistant' : m.role,
      content: m.content
    }));
  }

  async function callAI(history) {
    if (selectedProvider === 'openai') return callOpenAI(history);
    if (selectedProvider === 'google') return callGemini(history);
    return callClaude(history);
  }

  async function callClaude(history) {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': currentApiKey(),
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-calls': 'true'
      },
      body: JSON.stringify({
        model: selectedModel,
        max_tokens: 2048,
        system: buildSystemPrompt(),
        messages: normalizeHistory(history)
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    return data.content[0].text;
  }

  async function callOpenAI(history) {
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + currentApiKey()
      },
      body: JSON.stringify({
        model: selectedModel,
        max_completion_tokens: 2048,
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          ...normalizeHistory(history)
        ]
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    return data.choices[0].message.content;
  }

  async function callGemini(history) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${encodeURIComponent(currentApiKey())}`;
    const contents = normalizeHistory(history).map(m => ({
      role: m.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: m.content }]
    }));

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: buildSystemPrompt() }] },
        contents,
        generationConfig: { maxOutputTokens: 2048 }
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const parts = data.candidates?.[0]?.content?.parts;
    if (!parts || !parts.length) throw new Error('לא התקבלה תשובה מ-Gemini');
    return parts.map(p => p.text || '').join('');
  }

  // ─── Settings Dialog ─────────────────────────────────────────────
  // The dialog edits a draft copy of keys so "ביטול" doesn't lose changes
  let draftKeys = {};
  let dialogProvider = selectedProvider;
  let dialogModel = selectedModel;

  function openSettings() {
    draftKeys = { ...settings.apiKeys };
    dialogProvider = selectedProvider;
    dialogModel = selectedModel;
    document.getElementById('systemPromptInput').value = settings.systemPrompt || '';
    renderProviderUI();
    document.getElementById('settingsDialog').classList.add('open');
  }
  function closeSettings() { document.getElementById('settingsDialog').classList.remove('open'); }

  function renderProviderUI() {
    const p = PROVIDERS[dialogProvider];
    document.querySelectorAll('#providerSelector .model-chip').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.provider === dialogProvider);
    });
    document.getElementById('apiKeyLabel').textContent = p.keyLabel;
    document.getElementById('apiKeyInput').value = draftKeys[dialogProvider] || '';
    if (!p.models.some(([id]) => id === dialogModel)) dialogModel = p.models[0][0];
    document.getElementById('modelSelector').innerHTML = p.models.map(([id, name]) =>
      `<button class="model-chip ${id === dialogModel ? 'selected' : ''}" data-model="${id}" onclick="selectModel(this)">${name}</button>`
    ).join('');
  }

  function selectProvider(btn) {
    draftKeys[dialogProvider] = document.getElementById('apiKeyInput').value.trim();
    dialogProvider = btn.dataset.provider;
    renderProviderUI();
  }

  function selectModel(btn) {
    document.querySelectorAll('#modelSelector .model-chip').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    dialogModel = btn.dataset.model;
  }

  function saveSettings() {
    draftKeys[dialogProvider] = document.getElementById('apiKeyInput').value.trim();
    settings.apiKeys      = { ...draftKeys };
    settings.provider     = dialogProvider;
    settings.model        = dialogModel;
    settings.systemPrompt = document.getElementById('systemPromptInput').value.trim();
    delete settings.apiKey; // legacy field
    selectedProvider = dialogProvider;
    selectedModel = dialogModel;
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    closeSettings();
    updateHint();
  }

  function updateHint() {
    const hint = document.getElementById('modelHint');
    hint.textContent = currentApiKey()
      ? `מחובר · ${PROVIDERS[selectedProvider].name} · ${selectedModel}`
      : 'הגדר מפתח API בהגדרות כדי להפעיל את ה-AI';
  }

  // ─── Helpers ──────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('settingsDialog').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
  });

  // Listen for KB updates from knowledge.html
  window.addEventListener('storage', e => {
    if (e.key === 'kb_updated' || e.key === STORAGE_KEY) updateKBPanel();
  });

  // ─── Init ─────────────────────────────────────────────────────────
  updateKBPanel();
  updateHint();
  renderHistory();

  if (sessions.length === 0) {
    newChat();
  } else {
    loadSession(sessions[0].id);
  }
</script>
</body>
