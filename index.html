<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Assistant — מקומי</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pri: #6750A4; --on-pri: #fff; --pri-c: #EADDFF; --on-pri-c: #21005D;
      --sec: #625B71; --sec-c: #E8DEF8; --on-sec-c: #1D192B;
      --ter: #7D5260; --ter-c: #FFD8E4;
      --surf: #FFFBFE; --surf-var: #E7E0EC;
      --on-surf: #1C1B1F; --on-surf-var: #49454F;
      --out: #79747E; --out-var: #CAC4D0;
      --err: #B3261E;
      --e1: 0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
      --e2: 0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.15);
      --e3: 0 4px 8px 3px rgba(0,0,0,.15),0 1px 3px rgba(0,0,0,.3);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Roboto',sans-serif;background:#F4EFF4;color:var(--on-surf);height:100vh;display:flex;flex-direction:column;overflow:hidden}

    /* Top bar */
    .top-bar{background:var(--surf);height:64px;padding:0 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--e2);flex-shrink:0;z-index:10}
    .logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--ter));display:flex;align-items:center;justify-content:center}
    .logo .material-symbols-outlined{font-size:18px;color:#fff}
    .top-bar h1{font-size:20px;font-weight:400;flex:1}
    .top-bar a,.top-bar button.nav-btn{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--pri);font-size:13px;font-weight:500;padding:7px 14px;border-radius:20px;border:1px solid var(--out-var);background:none;cursor:pointer;transition:background .2s}
    .top-bar a:hover,.top-bar button.nav-btn:hover{background:var(--pri-c)}
    .kb-badge{background:var(--pri);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px}

    /* Layout */
    .layout{display:flex;flex:1;overflow:hidden}

    /* Sidebar */
    .sidebar{width:256px;background:var(--surf);border-left:1px solid var(--out-var);display:flex;flex-direction:column;flex-shrink:0}
    .sidebar-top{padding:12px 12px 8px;border-bottom:1px solid var(--out-var);display:flex;align-items:center;justify-content:space-between}
    .sidebar-top span{font-size:13px;font-weight:500;color:var(--on-surf-var)}
    .new-btn{display:flex;align-items:center;gap:4px;padding:5px 12px;border:none;background:var(--pri-c);color:var(--on-pri-c);border-radius:14px;font-size:12px;font-weight:500;cursor:pointer;transition:box-shadow .2s}
    .new-btn:hover{box-shadow:var(--e1)}
    .hist-list{flex:1;overflow-y:auto;padding:6px}
    .hist-item{padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--on-surf-var);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s}
    .hist-item:hover{background:var(--surf-var)}
    .hist-item.active{background:var(--sec-c);color:var(--on-sec-c)}

    /* KB summary */
    .kb-summary{padding:10px 12px;border-top:1px solid var(--out-var)}
    .kb-summary h3{font-size:11px;font-weight:500;color:var(--on-surf-var);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
    .kb-chip{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;background:var(--surf-var);font-size:12px;color:var(--on-surf-var);margin-bottom:3px}
    .kb-chip .material-symbols-outlined{font-size:13px}

    /* Chat */
    .chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}

    /* Welcome */
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:20px;padding:32px}
    .welcome-logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--ter));display:flex;align-items:center;justify-content:center;box-shadow:var(--e3)}
    .welcome-logo .material-symbols-outlined{font-size:32px;color:#fff}
    .welcome h2{font-size:26px;font-weight:400;text-align:center}
    .welcome p{font-size:14px;color:var(--on-surf-var);text-align:center;max-width:420px;line-height:1.6}
    .suggs{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:500px}
    .sugg{background:var(--surf);border-radius:12px;padding:14px;cursor:pointer;border:1px solid var(--out-var);font-size:13px;color:var(--on-surf);text-align:right;transition:all .2s}
    .sugg:hover{background:var(--pri-c);border-color:var(--pri);transform:translateY(-1px);box-shadow:var(--e1)}
    .sugg .si{font-size:18px;margin-bottom:6px;color:var(--pri);display:block}

    /* Messages */
    .msg{display:flex;gap:10px;max-width:82%;animation:mIn .18s ease-out}
    @keyframes mIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .msg.ai{align-self:flex-start}
    .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}
    .av.ai-av{background:linear-gradient(135deg,var(--pri),var(--ter))}
    .av.ai-av .material-symbols-outlined{font-size:16px;color:#fff}
    .av.u-av{background:var(--sec-c);color:var(--sec)}
    .bbl{padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.65;max-width:100%}
    .msg.user .bbl{background:var(--pri);color:#fff;border-bottom-left-radius:4px}
    .msg.ai .bbl{background:var(--surf);color:var(--on-surf);border-bottom-right-radius:4px;box-shadow:var(--e1)}
    .ref-tag{display:inline-flex;align-items:center;gap:3px;background:var(--sec-c);color:var(--sec);border-radius:5px;padding:1px 7px;font-size:11px;font-weight:500;margin:0 1px}
    .ref-tag .material-symbols-outlined{font-size:11px}
    .cat-section{margin-bottom:6px}
    .cat-label{font-size:11px;font-weight:600;color:var(--on-surf-var);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}

    /* Typing */
    .typing-bbl{background:var(--surf);border-radius:18px;border-bottom-right-radius:4px;padding:13px 16px;display:flex;gap:4px;align-items:center;box-shadow:var(--e1)}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--on-surf-var);animation:b .9s infinite}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

    /* Input */
    .input-area{padding:12px 20px 20px;background:#F4EFF4;flex-shrink:0}
    .input-wrap{background:var(--surf);border-radius:26px;display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 14px;box-shadow:var(--e2);transition:box-shadow .2s}
    .input-wrap:focus-within{box-shadow:var(--e3)}
    .input-wrap textarea{flex:1;border:none;outline:none;resize:none;font-size:15px;font-family:inherit;background:transparent;color:var(--on-surf);padding:7px 0;max-height:130px;line-height:1.5}
    .send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--pri);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
    .send-btn:hover{background:#7965AF;box-shadow:var(--e1)}
    .send-btn:disabled{background:var(--surf-var);color:var(--on-surf-var);cursor:default}
    .hint{text-align:center;font-size:11px;color:var(--on-surf-var);margin-top:6px}

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:var(--out-var);border-radius:3px}
  </style>
</head>
<body>

<div class="top-bar">
  <div class="logo"><span class="material-symbols-outlined">smart_toy</span></div>
  <h1>AI Assistant</h1>
  <a href="knowledge.html">
    <span class="material-symbols-outlined" style="font-size:17px">hub</span>
    מאגר ידע
    <span class="kb-badge" id="kbBadge">0</span>
  </a>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-top">
      <span>שיחות</span>
      <button class="new-btn" onclick="newChat()">
        <span class="material-symbols-outlined" style="font-size:14px">add</span>חדש
      </button>
    </div>
    <div class="hist-list" id="histList"></div>
    <div class="kb-summary" id="kbPanel">
      <h3>מאגר ידע</h3>
      <div id="kbSummary"></div>
    </div>
  </aside>

  <div class="chat">
    <div class="msgs" id="msgs"></div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="inp" rows="1" placeholder="שאל אותי על הפריטים במאגר הידע..." onkeydown="onKey(event)" oninput="resize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">
          <span class="material-symbols-outlined">send</span>
        </button>
      </div>
      <p class="hint">AI מקומי · מבוסס על מאגר הידע שלך בלבד</p>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════
const KB_KEY   = 'knowledgeBase';
const CAT_KEY  = 'knowledgeCategories';
const SESS_KEY = 'localAISessions';

let sessions = JSON.parse(localStorage.getItem(SESS_KEY) || '[]');
let curId    = null;
let busy     = false;

function getKB()   { return JSON.parse(localStorage.getItem(KB_KEY)  || '[]'); }
function getCats() { return JSON.parse(localStorage.getItem(CAT_KEY) || '[]'); }
function saveSess(){ localStorage.setItem(SESS_KEY, JSON.stringify(sessions)); }
function curSess() { return sessions.find(s => s.id === curId); }

// ══════════════════════════════════════════════
// KNOWLEDGE-BASE SIDEBAR
// ══════════════════════════════════════════════
function updateKBPanel() {
  const items = getKB(), cats = getCats();
  document.getElementById('kbBadge').textContent = items.length;
  const sum = document.getElementById('kbSummary');
  if (!items.length) { sum.innerHTML = '<div style="font-size:11px;opacity:.5">ריק</div>'; return; }
  const byCat = {};
  items.forEach(i => byCat[i.category] = (byCat[i.category]||0)+1);
  sum.innerHTML = Object.entries(byCat).map(([cid,n]) => {
    const cat = cats.find(c=>c.id===cid);
    return `<div class="kb-chip"><span class="material-symbols-outlined">${cat?cat.icon:'folder'}</span>${cat?cat.name:cid} (${n})</div>`;
  }).join('');
}

// ══════════════════════════════════════════════
// SESSIONS / HISTORY
// ══════════════════════════════════════════════
function newChat() {
  const s = { id: Date.now().toString(), title:'שיחה חדשה', msgs:[] };
  sessions.unshift(s); saveSess();
  loadSess(s.id); renderHist();
}
function loadSess(id) {
  curId = id; renderHist();
  const s = sessions.find(x=>x.id===id);
  if (!s) return;
  if (!s.msgs.length) { renderWelcome(); return; }
  const el = document.getElementById('msgs');
  el.innerHTML = '';
  s.msgs.forEach(m => appendMsg(m.role, m.html, false));
  el.scrollTop = el.scrollHeight;
}
function renderHist() {
  const el = document.getElementById('histList');
  if (!sessions.length) { el.innerHTML='<div style="padding:12px;font-size:12px;opacity:.5;text-align:center">אין שיחות</div>'; return; }
  el.innerHTML = sessions.slice(0,40).map(s =>
    `<div class="hist-item ${s.id===curId?'active':''}" onclick="loadSess('${s.id}')">${esc(s.title)}</div>`
  ).join('');
}

// ══════════════════════════════════════════════
// WELCOME
// ══════════════════════════════════════════════
function renderWelcome() {
  const kb = getKB();
  document.getElementById('msgs').innerHTML = `
    <div class="welcome">
      <div class="welcome-logo"><span class="material-symbols-outlined">smart_toy</span></div>
      <h2>שלום! במה אוכל לעזור?</h2>
      <p>אני AI מקומי שפועל <strong>ללא שרת</strong> — כל הידע שלי מגיע ממאגר הידע שלך (${kb.length} פריטים).</p>
      <div class="suggs">
        <div class="sugg" onclick="usePrompt('מה יש במאגר הידע שלי?')"><span class="si material-symbols-outlined">inventory_2</span>מה יש במאגר?</div>
        <div class="sugg" onclick="usePrompt('סכם לי לפי קטגוריות')"><span class="si material-symbols-outlined">category</span>סיכום לפי קטגוריות</div>
        <div class="sugg" onclick="usePrompt('מהם הקשרים בין הפריטים?')"><span class="si material-symbols-outlined">device_hub</span>הראה קשרים</div>
        <div class="sugg" onclick="usePrompt('חפש לי פריטים שקשורים ל')"><span class="si material-symbols-outlined">search</span>חפש פריט</div>
      </div>
    </div>`;
}
function usePrompt(t) { document.getElementById('inp').value=t; send(); }

// ══════════════════════════════════════════════
// MESSAGES
// ══════════════════════════════════════════════
function appendMsg(role, html, scroll=true) {
  const area = document.getElementById('msgs');
  area.querySelector('.welcome')?.remove();
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const av = document.createElement('div');
  av.className = `av ${role==='ai'?'ai-av':'u-av'}`;
  av.innerHTML = role==='ai' ? `<span class="material-symbols-outlined">smart_toy</span>` : 'א';
  const bbl = document.createElement('div');
  bbl.className = 'bbl'; bbl.innerHTML = html;
  d.appendChild(av); d.appendChild(bbl);
  area.appendChild(d);
  if (scroll) area.scrollTop = area.scrollHeight;
}
function showTyping() {
  const area = document.getElementById('msgs');
  const d = document.createElement('div');
  d.className='msg ai'; d.id='typing';
  const av=document.createElement('div'); av.className='av ai-av';
  av.innerHTML='<span class="material-symbols-outlined">smart_toy</span>';
  const bbl=document.createElement('div'); bbl.className='typing-bbl';
  bbl.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  d.appendChild(av); d.appendChild(bbl);
  area.appendChild(d); area.scrollTop=area.scrollHeight;
}
function hideTyping(){ document.getElementById('typing')?.remove(); }

// ══════════════════════════════════════════════
// SEND
// ══════════════════════════════════════════════
function send() {
  const inp = document.getElementById('inp');
  const q = inp.value.trim();
  if (!q || busy) return;
  if (!curId) newChat();
  const s = curSess();
  inp.value=''; resize(inp);

  const userHtml = esc(q).replace(/\n/g,'<br>');
  s.msgs.push({ role:'user', html: userHtml, text: q });
  if (s.title==='שיחה חדשה') s.title = q.slice(0,38)+(q.length>38?'…':'');
  saveSess();
  appendMsg('user', userHtml);
  renderHist();

  busy=true; document.getElementById('sendBtn').disabled=true;
  showTyping();

  // Simulate thinking delay for UX
  setTimeout(() => {
    const answer = think(q);
    hideTyping();
    s.msgs.push({ role:'ai', html: answer, text: stripHtml(answer) });
    saveSess();
    appendMsg('ai', answer);
    busy=false; document.getElementById('sendBtn').disabled=false;
  }, 400 + Math.random()*300);
}

// ══════════════════════════════════════════════
// LOCAL AI ENGINE
// ══════════════════════════════════════════════
function think(q) {
  const items = getKB();
  const cats  = getCats();
  const ql = q.toLowerCase();

  if (!items.length) {
    return `<b>מאגר הידע ריק.</b><br>עבור ל<a href="knowledge.html" style="color:var(--pri)">מאגר הידע</a> והוסף פריטים, קטגוריות וקשרים — ואז אוכל לענות על שאלות עליהם.`;
  }

  // ── 1. שאלת "מה יש" / סיכום כללי ──────────────────────────────
  if (/מה יש|מה במאגר|כמה פריטים|תסכם|סכם|סיכום|הכל|כל הפריטים|רשימה/.test(ql)) {
    return summarizeAll(items, cats);
  }

  // ── 2. סיכום לפי קטגוריות ───────────────────────────────────────
  if (/קטגורי|לפי קטגורי/.test(ql)) {
    return summarizeByCategory(items, cats);
  }

  // ── 3. קשרים ────────────────────────────────────────────────────
  if (/קשר|קשרים|מחובר|קשו|רלוונטי|יחס/.test(ql)) {
    const subject = extractSubject(ql, items);
    if (subject) return showRelations(subject, items, cats);
    return showAllRelations(items, cats);
  }

  // ── 4. חיפוש ספציפי ─────────────────────────────────────────────
  const found = searchItems(ql, items, cats);
  if (found.length) return presentResults(found, items, cats, q);

  // ── 5. שאלת "מי" / "מה הוא" ─────────────────────────────────────
  if (/מי|מה ה|מה זה|תסביר|ספר לי/.test(ql)) {
    const subject = extractSubject(ql, items);
    if (subject) return describeItem(subject, items, cats);
  }

  // ── 6. שאלת "כמה" ───────────────────────────────────────────────
  if (/כמה/.test(ql)) {
    const catMatch = cats.find(c => ql.includes(c.name.toLowerCase()));
    if (catMatch) {
      const n = items.filter(i=>i.category===catMatch.id).length;
      return `יש <b>${n} פריטים</b> בקטגוריה <b>${catMatch.name}</b>.`;
    }
    return `יש לך סך הכל <b>${items.length} פריטים</b> במאגר הידע.`;
  }

  // ── 7. חיפוש כללי ───────────────────────────────────────────────
  const broad = broadSearch(ql, items, cats);
  if (broad.length) return presentResults(broad, items, cats, q);

  return noAnswerMsg(q, items, cats);
}

// ── Summarize All ──────────────────────────────────────────────────
function summarizeAll(items, cats) {
  let out = `<b>מאגר הידע מכיל ${items.length} פריטים:</b><br><br>`;
  const byCat = groupBy(items, 'category');
  Object.entries(byCat).forEach(([cid, its]) => {
    const cat = cats.find(c=>c.id===cid);
    out += `<div class="cat-section"><div class="cat-label">${cat?cat.name:cid} (${its.length})</div>`;
    its.forEach(it => {
      out += `• <span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(it.name)}</span>`;
      if (it.content) out += ` — ${esc(it.content.slice(0,60))}${it.content.length>60?'…':''}`;
      out += '<br>';
    });
    out += '</div>';
  });
  return out;
}

// ── Summarize by Category ──────────────────────────────────────────
function summarizeByCategory(items, cats) {
  const byCat = groupBy(items, 'category');
  let out = `<b>סיכום לפי קטגוריות:</b><br><br>`;
  cats.forEach(cat => {
    const its = byCat[cat.id] || [];
    if (!its.length) return;
    out += `<div class="cat-section"><div class="cat-label">${cat.name} — ${its.length} פריטים</div>`;
    its.forEach(it => {
      out += `• ${esc(it.name)}`;
      if (it.relations?.length) out += ` ←→ ${it.relations.map(r=>`<span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(r)}</span>`).join(' ')}`;
      out += '<br>';
    });
    out += '</div>';
  });
  // Unknown categories
  const knownIds = cats.map(c=>c.id);
  const unknown = items.filter(i=>!knownIds.includes(i.category));
  if (unknown.length) {
    out += `<div class="cat-section"><div class="cat-label">אחר (${unknown.length})</div>`;
    unknown.forEach(it => { out += `• ${esc(it.name)}<br>`; });
    out += '</div>';
  }
  return out || 'לא נמצאו קטגוריות עם פריטים.';
}

// ── Show Relations ─────────────────────────────────────────────────
function showRelations(item, items, cats) {
  const cat = cats.find(c=>c.id===item.category);
  let out = `<b>קשרים של <span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(item.name)}</span>:</b><br><br>`;

  // Direct relations
  if (item.relations?.length) {
    out += `<b>קשרים ישירים:</b><br>`;
    item.relations.forEach(r => {
      const linked = items.find(i => i.name.toLowerCase()===r.toLowerCase());
      out += `• ${esc(r)}`;
      if (linked) { const lcat=cats.find(c=>c.id===linked.category); out += ` <span style="font-size:11px;opacity:.6">(${lcat?lcat.name:''})</span>`; }
      out += '<br>';
    });
    out += '<br>';
  }

  // Reverse relations
  const reverse = items.filter(i => i.id!==item.id && i.relations?.some(r=>r.toLowerCase()===item.name.toLowerCase()));
  if (reverse.length) {
    out += `<b>פריטים שמצביעים על ${esc(item.name)}:</b><br>`;
    reverse.forEach(i => { out += `• <span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(i.name)}</span><br>`; });
  }

  if (!item.relations?.length && !reverse.length) out += 'לא נמצאו קשרים לפריט זה.';
  return out;
}

function showAllRelations(items, cats) {
  const pairs = [];
  items.forEach(it => {
    (it.relations||[]).forEach(r => pairs.push({ from: it.name, to: r }));
  });
  if (!pairs.length) return 'לא הוגדרו קשרים במאגר הידע. ניתן להוסיף קשרים בעמוד <a href="knowledge.html" style="color:var(--pri)">מאגר הידע</a>.';
  let out = `<b>כל הקשרים במאגר (${pairs.length}):</b><br><br>`;
  pairs.forEach(p => {
    out += `<span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(p.from)}</span> → ${esc(p.to)}<br>`;
  });
  return out;
}

// ── Describe Item ──────────────────────────────────────────────────
function describeItem(item, items, cats) {
  const cat = cats.find(c=>c.id===item.category);
  let out = `<span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(item.name)}</span>`;
  if (cat) out += ` <span style="font-size:11px;opacity:.6">${cat.name}</span>`;
  out += '<br><br>';
  if (item.content) out += `${esc(item.content)}<br><br>`;
  if (item.relations?.length) {
    out += `<b>קשרים:</b> ${item.relations.map(r=>`<span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(r)}</span>`).join(' ')}<br>`;
  }
  return out;
}

// ── Search ─────────────────────────────────────────────────────────
function searchItems(q, items, cats) {
  const words = tokenize(q);
  return items.filter(it => {
    const target = [it.name, it.content||'', ...(it.relations||[])].join(' ').toLowerCase();
    return words.some(w => w.length > 1 && target.includes(w));
  }).sort((a,b) => score(b,words) - score(a,words));
}
function broadSearch(q, items, cats) {
  const words = tokenize(q).filter(w=>w.length>2);
  if (!words.length) return [];
  return items.filter(it => {
    const t = [it.name, it.content||''].join(' ').toLowerCase();
    return words.some(w => t.includes(w));
  });
}
function score(item, words) {
  const t = [item.name, item.content||'', ...(item.relations||[])].join(' ').toLowerCase();
  return words.reduce((s,w)=>{
    let pts=0;
    if (item.name.toLowerCase().includes(w)) pts+=3;
    if ((item.content||'').toLowerCase().includes(w)) pts+=1;
    return s+pts;
  },0);
}

function presentResults(found, items, cats, q) {
  let out = `<b>מצאתי ${found.length} פריט${found.length!==1?'ים':''} רלוונטי${found.length!==1?'ם':''}:</b><br><br>`;
  found.slice(0,8).forEach(it => {
    const cat = cats.find(c=>c.id===it.category);
    out += `<span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(it.name)}</span>`;
    if (cat) out += ` <span style="font-size:11px;opacity:.6">${cat.name}</span>`;
    if (it.content) out += `<br><span style="padding-right:8px;font-size:13px;opacity:.8">${esc(it.content.slice(0,120))}${it.content.length>120?'…':''}</span>`;
    if (it.relations?.length) out += `<br><span style="padding-right:8px;font-size:11px;opacity:.6">קשרים: ${it.relations.join(', ')}</span>`;
    out += '<br><br>';
  });
  if (found.length>8) out += `<span style="font-size:12px;opacity:.6">…ועוד ${found.length-8} פריטים נוספים</span>`;
  return out;
}

// ── Extract Subject ────────────────────────────────────────────────
function extractSubject(q, items) {
  // Try exact name match
  const ql = q.toLowerCase();
  let best = null, bestLen = 0;
  items.forEach(it => {
    const n = it.name.toLowerCase();
    if (ql.includes(n) && n.length > bestLen) { best=it; bestLen=n.length; }
  });
  return best;
}

// ── No Answer ──────────────────────────────────────────────────────
function noAnswerMsg(q, items, cats) {
  const sample = items.slice(0,3).map(i=>`<span class="ref-tag"><span class="material-symbols-outlined">link</span>${esc(i.name)}</span>`).join(' ');
  return `לא מצאתי מידע ספציפי על "<b>${esc(q)}</b>" במאגר הידע שלך.<br><br>פריטים קיימים: ${sample}${items.length>3?` ועוד ${items.length-3}…`:''}<br><br><span style="font-size:12px;opacity:.7">💡 נסה לשאול על שמות פריטים מדויקים, או עבור ל<a href="knowledge.html" style="color:var(--pri)">מאגר הידע</a> להוסיף מידע.</span>`;
}

// ── Helpers ────────────────────────────────────────────────────────
function groupBy(arr, key) {
  return arr.reduce((acc, x) => { (acc[x[key]] = acc[x[key]]||[]).push(x); return acc; }, {});
}
function tokenize(q) {
  return q.toLowerCase()
    .replace(/[?!.,;:]/g,'')
    .split(/\s+/)
    .filter(w => !['מה','יש','לי','של','את','אל','על','עם','הם','הן','היא','הוא','זה','זו','כן','לא','אני','אתה','אנחנו'].includes(w));
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripHtml(h){ return h.replace(/<[^>]+>/g,' ').trim(); }
